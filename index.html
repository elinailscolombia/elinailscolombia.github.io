<style>
/* Layout: una sola columna centrada sobre fondo vino, logo arriba, botones grandes tipo pastilla, tira de fotos al final */
:root {
  --vino: #6a022d;
  --vino-hondo: #4a0120;
  --vino-claro: #86143f;
  --rosa: #f8cddc;
  --rosa-suave: #fbe3ec;
  --blanco: #ffffff;
  --linea: rgba(248, 205, 220, .28);
  --display: "Cormorant Garamond", "Georgia", serif;
  --texto: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--vino-hondo); }
body {
  margin: 0;
  min-height: 100%;
  padding-inline: 20px;
  padding-block: 40px 32px;
  background:
    radial-gradient(520px 360px at 85% -40px, rgba(248,205,220,.20), transparent 70%),
    radial-gradient(480px 380px at -10% 38%, rgba(134,20,63,.65), transparent 70%),
    linear-gradient(180deg, var(--vino) 0%, var(--vino-hondo) 100%);
  background-color: var(--vino);
  color: var(--rosa-suave);
  font-family: var(--texto);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 460px; margin-inline: auto; display: flex; flex-direction: column; align-items: center; gap: 26px; position: relative; }

.spark { position: absolute; fill: var(--rosa); opacity: .85; pointer-events: none; }
.spark.a { width: 22px; top: 6px; left: -2px; animation: twinkle 4.5s ease-in-out infinite; }
.spark.b { width: 14px; top: 96px; right: 4px; animation: twinkle 5.5s ease-in-out -2s infinite; }
.spark.c { width: 10px; top: 150px; left: 14px; animation: twinkle 6s ease-in-out -3s infinite; }
@keyframes twinkle { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(.7); opacity: .35 } }

header { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 6px; }
.logo { width: min(100%, 330px); height: auto; display: block; }
.retrato { position: relative; width: min(78%, 300px); aspect-ratio: 700 / 881; margin-top: 4px; }
.retrato::before { content: ""; position: absolute; inset: 6% -14% 0 -14%; border-radius: 50% 50% 0 0 / 40% 40% 0 0; background: radial-gradient(closest-side at 50% 40%, rgba(248,205,220,.55), rgba(248,205,220,.14) 70%, transparent); }
.foto { position: relative; width: 100%; height: 100%; object-fit: contain; display: block; -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 100%); mask-image: linear-gradient(180deg, #000 78%, transparent 100%); filter: drop-shadow(0 14px 22px rgba(30,0,12,.45)); }
.logo { position: relative; margin-top: -58px; }

.nombre { font-family: var(--display); font-style: italic; font-weight: 600; font-size: 1.55rem; line-height: 1.1; color: var(--blanco); margin: 0; letter-spacing: .01em; }
.rol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; max-width: 380px; }
.rol li { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--rosa); padding: 5px 11px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--linea); white-space: nowrap; }
.sello { margin: 0; font-size: .9rem; color: var(--rosa-suave); opacity: .9; text-wrap: balance; max-width: 36ch; }

nav { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.btn {
  display: grid; grid-template-columns: 46px 1fr 22px; align-items: center; gap: 14px;
  width: 100%; min-height: 66px; padding: 10px 18px 10px 10px;
  border-radius: 999px; text-decoration: none;
  background: var(--rosa); color: var(--vino);
  box-shadow: 0 10px 24px -12px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.35);
  transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
}
.btn:hover { transform: translateY(-2px); background: var(--rosa-suave); box-shadow: 0 16px 28px -14px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.5); }
.btn:active { transform: translateY(0) scale(.99); }
.btn:focus-visible { outline: 3px solid var(--blanco); outline-offset: 3px; }
.ico { width: 46px; height: 46px; border-radius: 50%; background: var(--vino); display: grid; place-items: center; }
.ico svg { width: 23px; height: 23px; fill: none; stroke: var(--rosa); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.txt b { font-weight: 600; font-size: 1.04rem; letter-spacing: .01em; }
.txt span { font-size: .84rem; opacity: .78; overflow-wrap: anywhere; }
.flecha { width: 20px; height: 20px; fill: none; stroke: var(--vino); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }

.btn.principal { background: var(--blanco); min-height: 74px; }
.btn.principal .ico { background: var(--vino); }
.btn.principal .txt b { font-size: 1.14rem; }

.btn.pronto { background: transparent; color: var(--rosa); box-shadow: inset 0 0 0 1px var(--linea); pointer-events: none; }
.btn.pronto .ico { background: rgba(248,205,220,.14); }
.btn.pronto .txt span { opacity: .7; }
.btn.pronto .flecha { display: none; }

.muestra { width: 100%; display: flex; flex-direction: column; gap: 12px; }
.muestra h2 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 1.3rem; text-align: center; color: var(--rosa); display: flex; align-items: center; gap: 12px; }
.muestra h2::before, .muestra h2::after { content: ""; flex: 1; height: 1px; background: var(--linea); }
.fotos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fotos a { display: block; border-radius: 14px; overflow: hidden; aspect-ratio: 3 / 4; box-shadow: 0 0 0 1px var(--linea); }
.fotos a:focus-visible { outline: 3px solid var(--blanco); outline-offset: 2px; }
.fotos img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
.fotos a:hover img { transform: scale(1.05); }

footer { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .78rem; letter-spacing: .08em; color: var(--rosa); opacity: .8; text-align: center; }
footer a { color: inherit; text-underline-offset: 3px; }

@media (max-width: 380px) {
  .btn { grid-template-columns: 42px 1fr 18px; gap: 12px; }
  .ico { width: 42px; height: 42px; }
  .fotos { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .spark { animation: none; }
  .btn, .fotos img { transition: none; }
}
</style>
